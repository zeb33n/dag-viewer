[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-viewer"
version = "1.1.0"
dependencies = [
    "zensical>=0.0.46",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools]
packages = ["dag_viewer", "dag_viewer.assets"]

[tool.setuptools.package-data]
dag_viewer = [
    "assets/*",
]

[tool.myapp]
system_dependencies = ["graphviz (dot binary)"]
